title: The transformer as a candidate canonical cortical microcircuit
theme: minima

# Use each post's "# ..." heading as its page title, and remove it from the body
# so minima doesn't show the title twice
titles_from_headings:
  strip_title: true

# Serve part0.md as the landing page, without adding front matter to the post itself
defaults:
  - scope:
      path: "part0.md"
    values:
      permalink: /
      layout: page  # same layout as the other posts, so titles match

# README.md stays as the GitHub repo description but is left out of the site
exclude:
  - README.md
  - LICENSE
